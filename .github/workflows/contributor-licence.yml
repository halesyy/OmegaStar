name: Contributor licence

# Fails a pull request whose description does not agree to the contributor licence in CONTRIBUTING.md.
# It runs from the default branch's copy of this file and never checks out or runs the pull request's code,
# so a pull request cannot change its own result.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: contributor-licence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agreed:
    name: Contributor licence
    runs-on: ubuntu-latest
    steps:
      - name: The description agrees to the contributor licence
        env:
          AUTHOR: ${{ github.event.pull_request.author_association }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$AUTHOR" = OWNER ]; then
            echo "Opened by the repository owner: no agreement needed."
            exit 0
          fi
          # Two things count as agreeing, and nothing else does:
          # the template's line with its box ticked, or the sentence typed out in plain words as a
          # paragraph of its own (no indent, an empty line above it). The template's own text, which
          # has a link in it, only ever counts next to a ticked box, so no way of writing an unticked
          # box needs to be recognised here. A hidden comment counts for nothing.
          if perl -e '
            $_ = $ENV{BODY} // "";
            s/\r\n?/\n/g;
            s/<!--.*?(-->|\z)//gs;
            my $typed = qr/I agree to the contributor licen[cs]e for this and my past contributions/i;
            my $template = qr/I agree to the \[[*_]*contributor licen[cs]e[*_]*\]\([^)]*\) for this and my past contributions/i;
            my $above = "";
            for (split /\n/) {
              s/[ \t]+/ /g;
              s/ $//;
              exit 0 if /^ ?(?:[-*+]|\d+[.)]) \[x\] (?:$template|$typed)\.?$/i;
              exit 0 if $above eq "" && /^[*_"]*$typed[*_".]*$/;
              $above = $_;
            }
            exit 1;
          '; then
            echo "The description agrees to the contributor licence."
            exit 0
          fi
          echo "::error::This pull request has not agreed to the contributor licence. Tick the box in its description, or write \"I agree to the contributor licence for this and my past contributions\" there on a line of its own with an empty line above it. See CONTRIBUTING.md."
          exit 1
