name: Contributor licence

# Fails a pull request whose description does not agree to the contributor licence in CONTRIBUTING.md.
# It runs from the default branch's copy of this file and never checks out or runs the pull request's code,
# so a pull request cannot change its own result.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: contributor-licence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agreed:
    name: Contributor licence
    runs-on: ubuntu-latest
    steps:
      - name: The description agrees to the contributor licence
        env:
          AUTHOR: ${{ github.event.pull_request.author_association }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$AUTHOR" = OWNER ]; then
            echo "Opened by the repository owner: no agreement needed."
            exit 0
          fi
          # Agreeing is a line of its own: the template's box ticked, or the sentence written out.
          # A hidden comment is not an agreement, and spacing does not matter.
          if perl -e '
            $_ = $ENV{BODY} // "";
            s/<!--.*?(-->|\z)//gs;
            s/\xC2\xA0/ /g;
            s/[ \t\r]+/ /g;
            exit !m{^ ?([-*+] (\[x\] )?)?[*_"]*I agree to the \[?[*_]*contributor licen[cs]e[*_]*\]?(\([^)\n]*\))? for this and my past contributions[*_".]* ?$}mi;
          '; then
            echo "The description agrees to the contributor licence."
            exit 0
          fi
          echo "::error::This pull request has not agreed to the contributor licence. Tick the box in its description, or write \"I agree to the contributor licence for this and my past contributions\" there on a line of its own. See CONTRIBUTING.md."
          exit 1
